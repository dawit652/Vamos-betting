# Production stack: postgres 16, redis 7, migrate (one-shot), api, worker, scraper, web, admin and an
# optional TLS reverse proxy (profile "proxy").
#
#   cp infra/env.prod.example infra/.env.prod && $EDITOR infra/.env.prod
#   export COMPOSE_FILE=infra/docker-compose.prod.yml COMPOSE_ENV_FILES=infra/.env.prod
#   docker compose build && docker compose up -d            # add --profile proxy for Caddy
#   scripts/smoke.sh                                        # against the published ports
#
# Start order: postgres + redis healthy -> migrate exits 0 -> api + worker + scraper healthy -> web + admin.
# Details, backups and upgrades: docs/deployment.md, docs/backups.md. The development services
# (infra/docker-compose.yml) are separate and must not be used in production.

name: vamos

x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

x-hardening: &hardening
  restart: unless-stopped
  init: true
  logging: *logging
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  # A runaway or compromised process cannot fork-bomb the host (postgres needs about one process
  # per connection: max_connections is 200).
  pids_limit: 512

# Shared by the api, worker and migrate job (a mapping, so a service can override one entry).
# Optional URL-valued settings have no value (`NAME:`), which sets nothing while the variable is
# unset (an empty value would be refused).
# DATABASE_URL is the restricted app role `vamos_app` (migration 0030: no superuser, owns
# nothing, cannot rewrite the ledger or switch its triggers off); only the migrate job connects
# as the owner (POSTGRES_USER), and it gives vamos_app its login from APP_DB_PASSWORD.
x-app-env: &app-env
  NODE_ENV: '${NODE_ENV:-production}'
  OPERATING_MODE: '${OPERATING_MODE:-licensed}'
  LOG_LEVEL: '${LOG_LEVEL:-info}'
  API_HOST: '0.0.0.0'
  API_PORT: '4000'
  TRUST_PROXY: '${TRUST_PROXY:-}'
  PUBLIC_WEB_URL: '${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}'
  ADMIN_WEB_URL: '${ADMIN_WEB_URL:?set ADMIN_WEB_URL}'
  PUBLIC_API_URL: '${PUBLIC_API_URL:?set PUBLIC_API_URL}'
  PAYMENT_CALLBACK_BASE_URL:
  DATABASE_URL: 'postgres://vamos_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-vamos}'
  REDIS_URL: 'redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379'
  QUEUE_PREFIX: '${QUEUE_PREFIX:-vamos}'
  SESSION_SECRET: '${SESSION_SECRET:?set SESSION_SECRET}'
  PASSWORD_PEPPER: '${PASSWORD_PEPPER:?set PASSWORD_PEPPER}'
  ADMIN_TOTP_KEY: '${ADMIN_TOTP_KEY:?set ADMIN_TOTP_KEY}'
  MOCK_PAYMENT_WEBHOOK_SECRET: '${MOCK_PAYMENT_WEBHOOK_SECRET:?set MOCK_PAYMENT_WEBHOOK_SECRET}'
  FEED_PROVIDER: '${FEED_PROVIDER:-mock}'
  SIM_SPEED: '${SIM_SPEED:-1}'
  FEED_ROLLING_EVERY_MINUTES: '${FEED_ROLLING_EVERY_MINUTES:-5}'
  FEED_ROLLING_HORIZON_MINUTES: '${FEED_ROLLING_HORIZON_MINUTES:-120}'
  PAYMENT_PROVIDERS: '${PAYMENT_PROVIDERS:-mock}'
  KYC_PROVIDER: '${KYC_PROVIDER:-mock}'
  SMS_PROVIDER: '${SMS_PROVIDER:-mock}'
  REGISTRATION_SMS_VERIFICATION: '${REGISTRATION_SMS_VERIFICATION:-required}'
  # Alerts to the owner's phone (plan task 1.11): off while the list is empty.
  OWNER_ALERT_PHONES: '${OWNER_ALERT_PHONES:-}'
  OWNER_ALERT_MIN_INTERVAL_MINUTES: '${OWNER_ALERT_MIN_INTERVAL_MINUTES:-30}'
  CHAPA_BASE_URL: '${CHAPA_BASE_URL:-https://api.chapa.co/v1}'
  CHAPA_SECRET_KEY: '${CHAPA_SECRET_KEY:-}'
  CHAPA_WEBHOOK_SECRET: '${CHAPA_WEBHOOK_SECRET:-}'
  TELEBIRR_BASE_URL:
  TELEBIRR_CHECKOUT_URL:
  TELEBIRR_FABRIC_APP_ID: '${TELEBIRR_FABRIC_APP_ID:-}'
  TELEBIRR_APP_SECRET: '${TELEBIRR_APP_SECRET:-}'
  TELEBIRR_MERCHANT_APP_ID: '${TELEBIRR_MERCHANT_APP_ID:-}'
  TELEBIRR_SHORT_CODE: '${TELEBIRR_SHORT_CODE:-}'
  TELEBIRR_PRIVATE_KEY: '${TELEBIRR_PRIVATE_KEY:-}'
  TELEBIRR_PUBLIC_KEY: '${TELEBIRR_PUBLIC_KEY:-}'
  TAX_CONFIG_CONFIRMED: '${TAX_CONFIG_CONFIRMED:-false}'
  # SMS deposit rail (docs/runbooks/sms-rail.md), used when PAYMENT_PROVIDERS includes `sms`. Settings
  # without a value pass through from the env file and set nothing while unset, so the config's own
  # defaults apply (SMS_RAIL_MODE defaults to the simulated rail: set it to `live` to take real money).
  SMS_RAIL_MODE:
  SMS_GATEWAY_SECRET: '${SMS_GATEWAY_SECRET:-}'
  SMS_GATEWAY_ALLOWLIST:
  SMS_COLLECTION_ACCOUNTS: '${SMS_COLLECTION_ACCOUNTS:-}'
  OPERATOR_LEGAL_NAME: '${OPERATOR_LEGAL_NAME:-}'
  RECEIPT_VERIFY:
  PAYOUT_REQUIRE_PROOF:
  PAYOUT_PROOF_WAIVED:
  FEATURE_CASINO: '${FEATURE_CASINO:-false}'
  FEATURE_FACTORY_MARKETS: '${FEATURE_FACTORY_MARKETS:-false}'
  FEATURE_VIRTUALS: '${FEATURE_VIRTUALS:-false}'
  SMS_BETTING_ENABLED: '${SMS_BETTING_ENABLED:-false}'
  USSD_ENABLED: '${USSD_ENABLED:-false}'
  SMS_AGGREGATOR: '${SMS_AGGREGATOR:-mock}'
  SMS_WEBHOOK_SECRET: '${SMS_WEBHOOK_SECRET:?set SMS_WEBHOOK_SECRET}'
  SMS_SHORT_CODE: '${SMS_SHORT_CODE:-8123}'
  USSD_AGGREGATOR: '${USSD_AGGREGATOR:-mock}'
  USSD_SHARED_SECRET: '${USSD_SHARED_SECRET:?set USSD_SHARED_SECRET}'
  USSD_SERVICE_CODE: '${USSD_SERVICE_CODE:-*123#}'
  OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
  OTEL_SERVICE_NAME: '${OTEL_SERVICE_NAME:-}'
  # Scraper (docs/scraper.md section 7). Every service validates them (licensed mode with
  # FEED_PROVIDER=scraped needs a contact, robots enforced and an absolute archive directory); only
  # the scraper service writes the archive, at the path of its `scraper_archive` volume.
  SCRAPER_ARCHIVE_DIR: '/var/lib/vamos/scraper'
  SCRAPER_USER_AGENT: '${SCRAPER_USER_AGENT:-NahubetBot/1.0}'
  SCRAPER_CONTACT: '${SCRAPER_CONTACT:-}'
  SCRAPER_ROBOTS: '${SCRAPER_ROBOTS:-enforce}'
  SCRAPER_PORT: '4200'
  SCRAPER_MAX_CONCURRENCY: '${SCRAPER_MAX_CONCURRENCY:-4}'
  SCRAPER_RESULT_CONFIRM_MINUTES: '${SCRAPER_RESULT_CONFIRM_MINUTES:-15}'
  SCRAPER_MIN_RATING_MATCHES: '${SCRAPER_MIN_RATING_MATCHES:-8}'
  # Feed-quality switches (docs/scraper-operations.md); the defaults keep the behaviour before them.
  SCRAPER_HALF_TIME_MARKETS: '${SCRAPER_HALF_TIME_MARKETS:-all}'
  SCRAPER_AUTO_ALIAS: '${SCRAPER_AUTO_ALIAS:-off}'
  SCRAPER_PRIORITY_COMPETITIONS: '${SCRAPER_PRIORITY_COMPETITIONS:-}'
  SCRAPER_SKIP_REDUNDANT_SCORES: '${SCRAPER_SKIP_REDUNDANT_SCORES:-off}'
  SCRAPER_CAP_AT_BEST_PRICE: '${SCRAPER_CAP_AT_BEST_PRICE:-off}'
  SCRAPER_PRICE_EXPIRY_MINUTES: '${SCRAPER_PRICE_EXPIRY_MINUTES:-0}'
  SCRAPER_FACTORY_MARKETS: '${SCRAPER_FACTORY_MARKETS:-off}'

x-build-args: &build-args
  NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
  NEXT_PUBLIC_OPERATING_MODE: ${NEXT_PUBLIC_OPERATING_MODE:-licensed}

services:
  postgres:
    image: postgres:16-alpine
    <<: *hardening
    # The image starts as root, chowns its data directory and drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vamos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vamos}
    # WAL archiving for point-in-time recovery (docs/backups.md): gzipped segments go to the
    # `pgwal` volume; a segment is also closed every 5 minutes (archive_timeout), so the data loss
    # of a lost host is at most that, once backup.sh has copied the segments off the host.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /backups/wal/%f.gz && gzip -c %p > /backups/wal/%f.gz.tmp && mv /backups/wal/%f.gz.tmp /backups/wal/%f.gz
      - -c
      - archive_timeout=300
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgwal:/backups/wal
    networks: [vamos]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      wal-permissions:
        condition: service_completed_successfully

  # One-shot: lets the postgres user (uid 70) write the WAL archive volume.
  wal-permissions:
    image: postgres:16-alpine
    user: root
    entrypoint: ['sh', '-c', 'chown postgres:postgres /backups/wal && chmod 700 /backups/wal']
    volumes:
      - pgwal:/backups/wal
    restart: 'no'
    networks: [vamos]

  redis:
    image: redis:7-alpine
    <<: *hardening
    # Run as the image's redis user from the start. Starting as root and dropping privileges needs
    # DAC_OVERRIDE to read the 0700 appendonlydir after a restart, which is worse than no root.
    user: redis
    # BullMQ needs noeviction; the append-only file keeps queued jobs across a restart.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    networks: [vamos]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 4s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-shot job: applies pending migrations (same image as the api) and exits. Run it alone with
  # `docker compose run --rm migrate`. Other jobs of this image: dist/ops/seed.js (demo catalogue),
  # admin-create.js, admin-unlock.js, totp-rekey.js (docs/deployment.md).
  migrate:
    image: vamos-api:${VAMOS_VERSION:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: api
    <<: *hardening
    restart: 'no'
    read_only: true
    command: ['node', 'dist/ops/migrate.js']
    environment:
      <<: *app-env
      # The owner: applies the migrations, then sets the app role's login (APP_DB_PASSWORD).
      # Also the URL of `docker compose run --rm migrate node dist/ops/{seed,admin-*}.js`.
      DATABASE_URL: 'postgres://${POSTGRES_USER:-vamos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vamos}'
      APP_DB_PASSWORD: '${APP_DB_PASSWORD:?set APP_DB_PASSWORD}'
    networks: [vamos]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: vamos-api:${VAMOS_VERSION:-local}
    <<: *hardening
    read_only: true
    tmpfs: ['/tmp']
    environment: *app-env
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000'
    networks: [vamos]
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:4000/health']
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 30s

  worker:
    image: vamos-worker:${VAMOS_VERSION:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: worker
    <<: *hardening
    read_only: true
    tmpfs: ['/tmp']
    environment: *app-env
    # /health and /ready of the worker, for monitoring and scripts/smoke.sh --worker.
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${WORKER_HEALTH_PORT:-4100}:4100'
    networks: [vamos]
    # The worker finishes in-flight jobs on SIGTERM (up to 60 s).
    stop_grace_period: 75s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:4100/health']
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 30s

  # Collects fixtures, odds inputs and results from the configured sources and promotes checked data
  # to the catalogue. Run ONE instance (the source locks make a second harmless, but there is no
  # reason for it). The raw snapshots behind every applied result live in the `scraper_archive`
  # volume: kept as long as bets are kept, included in backup.sh (docs/backups.md).
  scraper:
    image: vamos-scraper:${VAMOS_VERSION:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: scraper
    <<: *hardening
    read_only: true
    tmpfs: ['/tmp']
    environment:
      <<: *app-env
      FEED_PROVIDER: 'scraped'
      # API keys of sources that authenticate with a header (docs/scraper.md 6.7). Only this service
      # gets them (not api, worker or migrate, which share *app-env). A source config names the
      # variable; the key is read here and never stored. Add one line per key, named
      # SCRAPER_SECRET_<NAME>; unset (empty) makes a source that needs it fail without a request.
      SCRAPER_SECRET_API_FOOTBALL: '${SCRAPER_SECRET_API_FOOTBALL:-}'
      SCRAPER_SECRET_FOOTBALL_DATA: '${SCRAPER_SECRET_FOOTBALL_DATA:-}'
      SCRAPER_SECRET_THEODDSAPI: '${SCRAPER_SECRET_THEODDSAPI:-}'
    volumes:
      - scraper_archive:/var/lib/vamos/scraper
    # /health and /ready are not published (nothing outside the stack needs them): scripts/smoke.sh
    # --scraper takes the container's address, see docs/deployment.md.
    networks: [vamos]
    # Shutdown waits up to 60 s for in-flight source runs.
    stop_grace_period: 75s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:4200/health']
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 30s

  web:
    image: vamos-web:${VAMOS_VERSION:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: web
      args: *build-args
    <<: *hardening
    # The code is root-owned in the image; only Next's cache directory is writable (uid 1000 = node).
    read_only: true
    tmpfs: ['/tmp', '/app/apps/web/.next/cache:uid=1000,gid=1000,mode=0700']
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Server-side rendering calls the API over the private network; the browser uses the
      # public URL that was baked into the bundle at build time (PUBLIC_API_URL).
      - API_INTERNAL_URL=http://api:4000
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    networks: [vamos]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  admin:
    image: vamos-admin:${VAMOS_VERSION:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: admin
      args: *build-args
    <<: *hardening
    # The code is root-owned in the image; only Next's cache directory is writable (uid 1000 = node).
    read_only: true
    tmpfs: ['/tmp', '/app/apps/admin/.next/cache:uid=1000,gid=1000,mode=0700']
    environment:
      - PORT=3001
      - NODE_ENV=production
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-3001}:3001'
    networks: [vamos]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3001/login']
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  # Optional TLS reverse proxy: docker compose --profile proxy up -d
  proxy:
    image: caddy:2-alpine
    profiles: [proxy]
    <<: *hardening
    # Binds 80/443 as the image's root user: only that capability is kept.
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ['/tmp']
    environment:
      - WEB_DOMAIN=${WEB_DOMAIN:-}
      - API_DOMAIN=${API_DOMAIN:-}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
      # Who may reach the back office and the staff API (/admin/* on API_DOMAIN): space-separated
      # IPs/CIDRs. Default anywhere; set it to the office or VPN ranges.
      - STAFF_ALLOWLIST=${STAFF_ALLOWLIST:-0.0.0.0/0 ::/0}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [vamos]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      admin:
        condition: service_healthy

networks:
  vamos:
    ipam:
      config:
        - subnet: ${VAMOS_SUBNET:-172.30.77.0/24}

volumes:
  pgdata:
  pgwal:
  redisdata:
  # Raw scraper snapshots (the evidence behind applied results), kept as long as bets: back it up.
  scraper_archive:
  caddy_data:
  caddy_config:
