# Local development services. Usage:
#   docker compose -f infra/docker-compose.yml up -d
# Published on loopback only: the dev password and the password-less Redis must not be reachable
# from the network.
#
# The project name is fixed: without it Docker names the project after the folder ("infra"), and
# another project whose compose file also sits in an `infra` folder then shares this project's
# containers and data volume (it happened with the bingo project on 14 Nov 2026). Ports 5433 and
# 6379 can still be taken by such a project: stop it first if `up` says a port is allocated.
name: vamos-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vamos
      POSTGRES_PASSWORD: vamos
      POSTGRES_DB: vamos
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vamos -d vamos']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
