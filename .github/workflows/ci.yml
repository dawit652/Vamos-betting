name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vamos
          POSTGRES_PASSWORD: vamos
          POSTGRES_DB: vamos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vamos -d vamos"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://vamos:vamos@localhost:5432/vamos
      REDIS_URL: redis://localhost:6379
      OPERATING_MODE: demo
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities in what ships fail the build (ASVS 14.2.1); the SBOM is kept (14.2.5).
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level=moderate
      - name: Software bill of materials (CycloneDX)
        run: pnpm -s sbom > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
      - run: pnpm format:check
      # typecheck first: it runs `next typegen`, whose route types lint needs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - name: Backup script test (stub docker, real age)
        run: sudo apt-get install -y --no-install-recommends age && pnpm test:infra
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright, mobile Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vamos
          POSTGRES_PASSWORD: vamos
          POSTGRES_DB: vamos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vamos -d vamos"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://vamos:vamos@localhost:5432/vamos
      REDIS_URL: redis://localhost:6379
      OPERATING_MODE: demo
      LOG_LEVEL: info
      # The fast simulator: a match lasts seconds and a rolling fixture kicks
      # off every minute, so the e2e bet settles within a few minutes.
      SIM_SPEED: '60'
      FEED_ROLLING_EVERY_MINUTES: '1'
      FEED_ROLLING_HORIZON_MINUTES: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI has no preinstalled browsers (the dev container has /opt/pw-browsers):
      # install the Chromium build that the pinned @playwright/test expects.
      - name: Install Chromium for Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Build the API, worker and web app
        run: e2e/scripts/stack.sh build
      - name: Start the API, worker (fast simulator) and web app
        run: e2e/scripts/stack.sh start
      - run: pnpm e2e
      - name: Stop the stack
        if: always()
        run: e2e/scripts/stack.sh stop
      - name: Upload the Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.stack/*.log
          retention-days: 7
          include-hidden-files: true

  docker:
    name: Docker images and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: infra/docker-compose.prod.yml
      COMPOSE_ENV_FILES: infra/.env.prod
    steps:
      - uses: actions/checkout@v4
      # Throwaway secrets; the stack runs in demo mode on http://localhost URLs.
      - run: infra/scripts/init-env.sh
      - name: Validate the Caddy configuration (proxy profile)
        run: |
          docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e ACME_EMAIL=ops@example.et -e WEB_DOMAIN=vamos.example.et \
            -e API_DOMAIN=api.vamos.example.et -e ADMIN_DOMAIN=admin.vamos.example.et \
            -e STAFF_ALLOWLIST=10.0.0.0/8 \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build the images (api, worker, web, admin)
        run: docker compose build
      - name: Start postgres, redis, migrate, api, worker, web and admin
        run: |
          docker compose up -d --wait --wait-timeout 240
          docker compose run --rm migrate node dist/ops/seed.js
      - name: Smoke test
        run: scripts/smoke.sh --production --wait 120 --worker http://localhost:4100
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
